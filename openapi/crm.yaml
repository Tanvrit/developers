paths:
  # ── CRM Activities ────────────────────────────────────────────────────────

  /api/crm/activity/create:
    post:
      tags: [CRM]
      summary: Create a CRM activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                leadId:
                  type: string
                  nullable: true
                dealId:
                  type: string
                  nullable: true
                contactId:
                  type: string
                  nullable: true
                type:
                  type: string
                  example: CALL
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                scheduledAt:
                  type: string
                  format: date-time
                  nullable: true
              required: [businessId, type, title]
      responses:
        '200':
          description: Activity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/crm/activity/update:
    post:
      tags: [CRM]
      summary: Update a CRM activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                title:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                type:
                  type: string
                  nullable: true
                scheduledAt:
                  type: string
                  format: date-time
                  nullable: true
                completedAt:
                  type: string
                  format: date-time
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Activity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/crm/activity/delete:
    post:
      tags: [CRM]
      summary: Delete a CRM activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Activity deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/crm/activity/get:
    post:
      tags: [CRM]
      summary: Get a CRM activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Activity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/crm/activity/list:
    post:
      tags: [CRM]
      summary: List activities for an entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                leadId:
                  type: string
                  nullable: true
                dealId:
                  type: string
                  nullable: true
                contactId:
                  type: string
                  nullable: true
              required: [businessId]
      responses:
        '200':
          description: Activity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/crm/activity/complete:
    post:
      tags: [CRM]
      summary: Mark an activity as complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Activity completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/crm/activity/upcoming:
    post:
      tags: [CRM]
      summary: List upcoming activities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      inventoryId:
                        type: string
                      receivedQuantity:
                        type: integer
                        format: int64
              required: [id, items]
      responses:
        '200':

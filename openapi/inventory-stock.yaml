          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/audit/complete:
    post:
      tags: [Inventory Stock]
      summary: Complete a stock audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Audit completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/audit/apply:
    post:
      tags: [Inventory Stock]
      summary: Apply audit adjustments
      description: Applies discrepancy adjustments found during the audit to actual stock levels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Adjustments applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/audit/report:
    post:
      tags: [Inventory Stock]
      summary: Generate audit report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Audit report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'


paths:
  # ── Inventory Store (stock levels) ────────────────────────────────────────

  /api/inventory/store_inventory/CREATE_PRODUCT_INVENTORY:
    post:
      tags: [Inventory Stock]
      summary: Create an inventory record
      description: Creates a stock record for a product in a store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                inventoryId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Inventory record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/store_inventory/RETRIEVE_PRODUCT_INVENTORY:
    post:
      tags: [Inventory Stock]
      summary: Retrieve an inventory record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inventoryId:
                  type: string
                businessId:
                  type: string
      responses:
        '200':
          description: Inventory record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/store_inventory/UPDATE_PRODUCT_INVENTORY:
    post:
      tags: [Inventory Stock]
      summary: Update an inventory record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inventoryId:
                  type: string
                businessId:
                  type: string
      responses:
        '200':
          description: Inventory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/store_inventory/DELETE_PRODUCT_INVENTORY:
    post:
      tags: [Inventory Stock]
      summary: Delete an inventory record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inventoryId:
                  type: string
                businessId:
                  type: string
      responses:
        '200':
          description: Inventory deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Inventory Batches ─────────────────────────────────────────────────────

  /api/inventory/batch/create:
    post:
      tags: [Inventory Stock]
      summary: Create an inventory batch
      description: Creates a batch (lot/shipment) for an inventory item with expiry tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                inventoryId:
                  type: string
                batchNumber:
                  type: string
                quantity:
                  type: integer
                  format: int64
                expiryDate:
                  type: string
                  format: date
                  nullable: true
              required: [businessId, inventoryId, batchNumber]
      responses:
        '200':
          description: Batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/batch/update:
    post:
      tags: [Inventory Stock]
      summary: Update an inventory batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                batchNumber:
                  type: string
                  nullable: true
                quantity:
                  type: integer
                  format: int64
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Batch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/batch/retrieve:
    post:
      tags: [Inventory Stock]
      summary: Retrieve a batch by ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Batch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/batch/delete:
    post:
      tags: [Inventory Stock]
      summary: Delete a batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Batch deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/batch/by-inventory:
    post:
      tags: [Inventory Stock]
      summary: List batches for an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inventoryId:
                  type: string
              required: [inventoryId]
      responses:
        '200':
          description: Batch list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/batch/list:
    post:
      tags: [Inventory Stock]
      summary: List all batches for a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
              required: [businessId]
      responses:
        '200':
          description: Batch list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/batch/expiring-soon:
    get:
      tags: [Inventory Stock]
      summary: Get batches expiring soon
      parameters:
        - in: query
          name: businessId
          required: true
          schema:
            type: string
        - in: query
          name: daysAhead
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Expiring batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/batch/consume:
    post:
      tags: [Inventory Stock]
      summary: FIFO consume from batches
      description: Deducts quantity using FIFO (oldest batch first).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inventoryId:
                  type: string
                quantity:
                  type: integer
                  format: int64
              required: [inventoryId, quantity]
      responses:
        '200':
          description: Quantity consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/batch/expiry-report:
    get:
      tags: [Inventory Stock]
      summary: Get batch expiry report
      parameters:
        - in: query
          name: businessId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Expiry report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Stock Audits ──────────────────────────────────────────────────────────

  /api/inventory/audit/CREATE:

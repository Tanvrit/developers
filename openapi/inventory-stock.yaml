  # ── Purchase Orders ───────────────────────────────────────────────────────

  /api/inventory/purchase-order/create:
    post:
      tags: [Inventory Stock]
      summary: Create a purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                supplierId:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      inventoryId:
                        type: string
                      quantity:
                        type: integer
                        format: int64
                      unitCost:
                        type: integer
                        format: int64
              required: [businessId, supplierId, items]
      responses:
        '200':
          description: Purchase order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/purchase-order/update:

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        businessId:
          type: string
        storeId:
          type: string
          nullable: true
        items:
          type: array
          items:
            type: object
        totalAmount:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum: [PENDING, CONFIRMED, PREPARING, READY, DISPATCHED, DELIVERED, CANCELLED, DECLINED]
        createdAt:
          type: string
          format: date-time
          nullable: true

    CartItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        name:
          type: string
          nullable: true
        quantity:
          type: integer
        price:
          type: number
          format: double
        image:
          type: string
          nullable: true

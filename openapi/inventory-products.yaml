components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          nullable: true
        images:
          type: array
          items:
            type: string
        categoryId:
          type: string
          nullable: true
        subCategoryId:
          type: string
          nullable: true
        businessId:
          type: string
        storeId:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int64
          nullable: true
        brandId:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true

    CreateProductRequest:
      type: object
      properties:
        userId:
          type: string
        businessId:
          type: string
        storeId:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        subCategoryId:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int64
          nullable: true
      required: [userId, businessId, name]

    ProductCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
          nullable: true
        businessId:
          type: string
        parentId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true

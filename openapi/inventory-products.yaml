paths:
  # ── Inventory — Products ───────────────────────────────────────────────────

  /api/inventory/product/CREATE_PRODUCT:
    post:
      tags: [Inventory Products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: Product created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Product'

  /api/inventory/product/RETRIEVE_PRODUCT:
    post:
      tags: [Inventory Products]
      summary: Retrieve products
      description: Returns products for a business, optionally filtered by store and last sync date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                storeId:
                  type: string
                  nullable: true
                lastSyncDate:
                  type: string
                  nullable: true
                page:
                  type: integer
                  default: 1
                limit:
                  type: integer
                  default: 50
              required: [businessId]
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      payload:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'

  /api/inventory/product/UPDATE_PRODUCT:
    post:
      tags: [Inventory Products]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                businessId:
                  type: string
                name:
                  type: string
                  nullable: true
                categoryId:
                  type: string
                  nullable: true
                quantity:
                  type: integer
                  format: int64
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Product'

  /api/inventory/product/DELETE_PRODUCT:
    post:
      tags: [Inventory Products]
      summary: Delete a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/product/BLACKLIST_PRODUCT:
    post:
      tags: [Inventory Products]
      summary: Blacklist a product
      description: Hides a product from the public catalog without deleting it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                productId:
                  type: string
              required: [businessId, productId]
      responses:
        '200':
          description: Product blacklisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/inventory/product/list:
    get:
      tags: [Inventory Products]
      summary: List products (paginated)
      parameters:
        - in: query
          name: businessId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  # ── Inventory — Categories ─────────────────────────────────────────────────

  /api/inventory/category/CREATE_PRODUCT_CATEGORY:

paths:
  # ── Platform ──────────────────────────────────────────────────────────────

  /api/platform/RETRIEVE:
    post:
      tags: [Platform & Admin]
      summary: Retrieve all platforms (public)
      security: []
      responses:
        '200':
          description: Platform list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/platform/FIND:
    post:
      tags: [Platform & Admin]
      summary: Find a platform by ID (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Platform details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/platform/DELETE:
    post:
      tags: [Platform & Admin]
      summary: Delete a platform (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Platform deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Platform Profiles ─────────────────────────────────────────────────────

  /api/platforms/profile:
    get:
      tags: [Platform & Admin]
      summary: List all platform profiles (public)
      security: []
      responses:
        '200':
          description: Platform profile list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/platforms/profile/appIds:
    get:
      tags: [Platform & Admin]
      summary: List app IDs and labels (public)
      security: []
      responses:
        '200':
          description: App ID list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/platforms/{appId}/profile:
    get:
      tags: [Platform & Admin]
      summary: Get platform profile by appId (public)
      security: []
      parameters:
        - in: path
          name: appId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Platform profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
    put:
      tags: [Platform & Admin]
      summary: Upsert platform profile (admin)
      parameters:
        - in: path
          name: appId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: true
                logoUrl:
                  type: string
                  nullable: true
                primaryColor:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Profile upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
    delete:
      tags: [Platform & Admin]
      summary: Delete platform profile (admin)
      parameters:
        - in: path
          name: appId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Platform Provider Credentials ─────────────────────────────────────────

  /api/platforms/{appId}/auth-config:

paths:
  # ── Compute Jobs ──────────────────────────────────────────────────────────

  /api/compute/job/submit:
    post:
      tags: [Compute]
      summary: Submit a compute job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  nullable: true
                image:
                  type: string
                  nullable: true
                command:
                  type: array
                  items:
                    type: string
                  nullable: true
                envVars:
                  type: object
                  additionalProperties:
                    type: string
                  nullable: true
                resources:
                  type: object
                  nullable: true
                clusterId:
                  type: string
                  nullable: true
              required: []
      responses:
        '200':
          description: Job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/compute/job/status:
    post:
      tags: [Compute]
      summary: Get compute job status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/compute/job/cancel:
    post:
      tags: [Compute]
      summary: Cancel a compute job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/compute/job/list:
    post:
      tags: [Compute]
      summary: List compute jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  nullable: true
                clusterId:
                  type: string
                  nullable: true
                page:
                  type: integer
                  default: 0
                limit:
                  type: integer
                  default: 20
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/compute/job/logs:
    post:
      tags: [Compute]
      summary: Get compute job logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                tail:
                  type: integer
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Job logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/compute/job/retry:
    post:
      tags: [Compute]
      summary: Retry a failed compute job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Job retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/compute/job/extend:
    post:
      tags: [Compute]
      summary: Extend compute job timeout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                additionalMinutes:
                  type: integer
              required: [id, additionalMinutes]
      responses:
        '200':
          description: Job timeout extended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Compute Nodes ─────────────────────────────────────────────────────────

  /api/compute/node/register:
    post:
      tags: [Compute]
      summary: Register a compute node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                hostname:
                  type: string
                port:
                  type: integer
                  nullable: true
                gpuCount:
                  type: integer
                  nullable: true
                cpuCount:
                  type: integer
                  nullable: true
                memoryGB:
                  type: number
                  format: double
                  nullable: true
              required: [name, hostname]
      responses:
        '200':
          description: Node registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/compute/node/list:
    get:
      tags: [Compute]
      summary: List compute nodes
      parameters:
        - in: query
          name: status
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: Node list

  # ── Compute Templates ─────────────────────────────────────────────────────

  /api/compute/template/create:
    post:
      tags: [Compute]
      summary: Create a compute template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true

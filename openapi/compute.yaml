                  nullable: true
                resources:
                  type: object
                  nullable: true
                envVars:
                  type: object
                  additionalProperties:
                    type: string
                  nullable: true
                isPublic:
                  type: boolean
                  nullable: true
              required: [name, image]
      responses:
        '200':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/compute/template/update:

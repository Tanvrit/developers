      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                action:
                  type: string
                  example: APPROVE
                reason:
                  type: string
                  nullable: true
              required: [id, action]
      responses:
        '200':
          description: Review moderated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/review/VOTE_HELPFUL:
    post:

paths:
  # ── Media Files ───────────────────────────────────────────────────────────

  /api/mediaFile/RETRIEVE:
    post:
      tags: [Media & Social]
      summary: Retrieve media files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  nullable: true
                ownerId:
                  type: string
                  nullable: true
                ownerType:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Media file list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/mediaFile/UPLOAD:
    post:
      tags: [Media & Social]
      summary: Upload a media file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
                fileName:
                  type: string
                contentType:
                  type: string
              required: [ownerId, ownerType, fileName, contentType]
      responses:
        '200':
          description: Upload URL returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/mediaFile/CREATE:
    post:
      tags: [Media & Social]
      summary: Create a media file record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
                url:
                  type: string
                fileName:
                  type: string
                  nullable: true
                contentType:
                  type: string
                  nullable: true
              required: [ownerId, ownerType, url]
      responses:
        '200':
          description: Media file created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/mediaFile/DELETE:
    post:
      tags: [Media & Social]
      summary: Delete a media file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Media file deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/v1/media/presign:
    post:
      tags: [Media & Social]
      summary: Generate a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                contentType:
                  type: string
                ownerId:
                  type: string
                ownerType:
                  type: string
              required: [fileName, contentType, ownerId, ownerType]
      responses:
        '200':
          description: Presigned URL and file ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/v1/media/{fileId}/confirm:
    post:
      tags: [Media & Social]
      summary: Confirm media upload completion
      parameters:
        - in: path
          name: fileId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Feed (gathering / social) ─────────────────────────────────────────────

  /api/feed/post:
    post:
      tags: [Media & Social]
      summary: Create a gathering feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gatheringId:
                  type: string
                content:
                  type: string
                  nullable: true
                mediaUrls:
                  type: array
                  items:
                    type: string
                  nullable: true
              required: [gatheringId]
      responses:
        '200':
          description: Feed post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/feed/context:
    post:
      tags: [Media & Social]
      summary: Retrieve gathering feed posts by context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gatheringId:
                  type: string
              required: [gatheringId]
      responses:
        '200':
          description: Feed posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/feed/react:
    post:
      tags: [Media & Social]
      summary: React to a feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                postId:
                  type: string
                reaction:
                  type: string
                  example: LIKE
              required: [postId, reaction]
      responses:
        '200':
          description: Reaction recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/feed/comment:
    post:
      tags: [Media & Social]
      summary: Comment on a feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                postId:
                  type: string
                content:
                  type: string
              required: [postId, content]
      responses:
        '200':
          description: Comment added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/feed/comments:
    post:
      tags: [Media & Social]
      summary: Get comments for a feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                postId:
                  type: string
              required: [postId]
      responses:
        '200':
          description: Comment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/feed/pin:
    post:
      tags: [Media & Social]
      summary: Pin a feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                postId:
                  type: string
              required: [postId]
      responses:
        '200':
          description: Post pinned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/feed/delete:
    post:
      tags: [Media & Social]
      summary: Delete a feed post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                postId:
                  type: string
              required: [postId]
      responses:
        '200':
          description: Feed post deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Posts ─────────────────────────────────────────────────────────────────

  /api/post/create:
    post:
      tags: [Media & Social]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorId:
                  type: string
                content:
                  type: string
                  nullable: true
                mediaUrls:
                  type: array
                  items:
                    type: string
                  nullable: true
                visibility:
                  type: string
                  nullable: true
              required: [authorId]
      responses:
        '200':
          description: Post created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/post/update:
    post:
      tags: [Media & Social]
      summary: Update a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                content:
                  type: string
                  nullable: true
                visibility:
                  type: string
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/post/delete:
    post:
      tags: [Media & Social]
      summary: Delete a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/post/{postId}:
    get:
      tags: [Media & Social]
      summary: Get a post by ID
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/post/list:
    post:
      tags: [Media & Social]
      summary: List posts with pagination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authorId:
                  type: string
                  nullable: true
                page:
                  type: integer
                  default: 0
                limit:
                  type: integer
                  default: 20
      responses:
        '200':
          description: Post list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/post/like:
    post:
      tags: [Media & Social]
      summary: Like a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                postId:
                  type: string
              required: [postId]
      responses:
        '200':
          description: Post liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/post/unlike:
    post:
      tags: [Media & Social]
      summary: Unlike a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                postId:
                  type: string
              required: [postId]
      responses:
        '200':
          description: Post unliked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Follow ────────────────────────────────────────────────────────────────

  /api/follow/FOLLOW:
    post:
      tags: [Media & Social]
      summary: Follow a user
      requestBody:
        required: true

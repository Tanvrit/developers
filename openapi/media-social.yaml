  /api/follow/GET_STATS:
    post:
      tags: [Media & Social]
      summary: Get follow statistics for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
              required: [userId]
      responses:
        '200':
          description: Follow stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/follow/IS_FOLLOWING:
    post:
      tags: [Media & Social]
      summary: Check if a user is following another
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                followerId:
                  type: string
                followeeId:
                  type: string
              required: [followerId, followeeId]
      responses:
        '200':
          description: Following status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Ratings ───────────────────────────────────────────────────────────────

  /api/rating/CREATE_RATING:
    post:
      tags: [Media & Social]
      summary: Create a rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityId:
                  type: string
                entityType:
                  type: string
                userId:
                  type: string
                rating:
                  type: number
                  format: double
                  minimum: 1
                  maximum: 5
              required: [entityId, entityType, userId, rating]
      responses:
        '200':
          description: Rating created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/rating/UPDATE_RATING:
    post:
      tags: [Media & Social]
      summary: Update a rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                rating:
                  type: number
                  format: double
              required: [id, rating]
      responses:
        '200':
          description: Rating updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/rating/RETRIEVE_RATING:
    post:
      tags: [Media & Social]
      summary: Retrieve ratings
      requestBody:
        required: true

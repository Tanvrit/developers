          application/json:
            schema:
              type: object
              properties:
                entityId:
                  type: string
                  nullable: true
                entityType:
                  type: string
                  nullable: true
                userId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Rating list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/rating/DELETE_RATING:
    post:
      tags: [Media & Social]
      summary: Delete a rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Rating deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/rating/GET_RATING_SUMMARY:
    post:
      tags: [Media & Social]
      summary: Get rating summary for an entity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityId:
                  type: string
                entityType:
                  type: string
              required: [entityId, entityType]
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Product Reviews ───────────────────────────────────────────────────────

  /api/review/CREATE_REVIEW:
    post:
      tags: [Media & Social]
      summary: Create a product review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                userId:
                  type: string
                rating:
                  type: number
                  format: double
                title:
                  type: string
                  nullable: true
                body:
                  type: string
                  nullable: true
              required: [productId, userId, rating]
      responses:
        '200':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/review/UPDATE_REVIEW:
    post:
      tags: [Media & Social]
      summary: Update a product review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                rating:
                  type: number
                  format: double
                  nullable: true
                title:
                  type: string
                  nullable: true
                body:
                  type: string
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Review updated

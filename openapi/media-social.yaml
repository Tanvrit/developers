          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
              required: [productId]
      responses:
        '200':
          description: Review summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/review/MODERATE_REVIEW:
    post:
      tags: [Media & Social]

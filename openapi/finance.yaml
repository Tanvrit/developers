      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
              required: [businessId]
      responses:
        '200':
          description: Payout schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/schedule/update:
    post:
      tags: [Finance]
      summary: Update a payout schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                frequency:
                  type: string
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Payout schedule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/schedule/delete:
    post:
      tags: [Finance]
      summary: Delete a payout schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Payout schedule deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/batch/create:
    post:
      tags: [Finance]
      summary: Create a payout batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                payoutAccountId:
                  type: string
                amount:
                  type: number
                  format: double
              required: [businessId, payoutAccountId, amount]
      responses:
        '200':
          description: Payout batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/batch/retrieve:
    post:
      tags: [Finance]
      summary: Retrieve payout batches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
              required: [businessId]
      responses:
        '200':
          description: Payout batch list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/batch/update:
    post:
      tags: [Finance]
      summary: Update a payout batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                status:
                  type: string
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Payout batch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/batch/delete:
    post:
      tags: [Finance]
      summary: Delete a payout batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Payout batch deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Wallet ────────────────────────────────────────────────────────────────

  /api/wallet/create:
    post:
      tags: [Finance]
      summary: Create a wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
                  example: USER
                currency:
                  type: string
                  nullable: true
              required: [ownerId, ownerType]
      responses:
        '200':
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wallet/retrieve:
    post:
      tags: [Finance]
      summary: Retrieve a wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
              required: [ownerId, ownerType]
      responses:
        '200':
          description: Wallet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wallet/retrieveForBusiness:
    post:
      tags: [Finance]
      summary: Retrieve wallet for a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
              required: [businessId]
      responses:
        '200':
          description: Business wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wallet/balance:
    post:
      tags: [Finance]
      summary: Get wallet balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
              required: [ownerId, ownerType]
      responses:
        '200':
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wallet/addFunds:
    post:
      tags: [Finance]
      summary: Add funds to a wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
                amount:
                  type: number
                  format: double
                reference:
                  type: string
                  nullable: true
              required: [ownerId, ownerType, amount]
      responses:
        '200':
          description: Funds added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wallet/withdrawFunds:
    post:
      tags: [Finance]
      summary: Withdraw funds from a wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
                amount:
                  type: number
                  format: double
              required: [ownerId, ownerType, amount]
      responses:
        '200':
          description: Funds withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wallet/transfer:
    post:
      tags: [Finance]
      summary: Transfer funds between wallets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fromOwnerId:
                  type: string
                fromOwnerType:
                  type: string
                toOwnerId:
                  type: string
                toOwnerType:
                  type: string
                amount:
                  type: number
                  format: double
              required: [fromOwnerId, fromOwnerType, toOwnerId, toOwnerType, amount]
      responses:
        '200':
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wallet/update:
    post:
      tags: [Finance]
      summary: Update wallet metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                currency:
                  type: string
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Wallet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wallet/delete:
    post:
      tags: [Finance]
      summary: Delete a wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Wallet deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Transactions ──────────────────────────────────────────────────────────

  /api/transactions/create:
    post:
      tags: [Finance]
      summary: Create a transaction record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                amount:
                  type: number
                  format: double
                type:
                  type: string
                  example: SALE
                reference:
                  type: string
                  nullable: true
              required: [businessId, amount, type]
      responses:
        '200':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/transactions/retrieve:
    post:
      tags: [Finance]
      summary: Retrieve transaction(s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  nullable: true
                businessId:
                  type: string
                  nullable: true
                type:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/transactions/update:
    post:
      tags: [Finance]
      summary: Update transaction status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                status:
                  type: string
              required: [id, status]
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/transactions/delete:
    post:
      tags: [Finance]
      summary: Delete a transaction record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Transaction deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/transactions/search:
    post:
      tags: [Finance]
      summary: Search transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                query:
                  type: string
                  nullable: true
                startDate:
                  type: string
                  format: date-time
                  nullable: true
                endDate:
                  type: string
                  format: date-time
                  nullable: true
              required: [businessId]
      responses:
        '200':
          description: Matching transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/transactions/reconcile:
    post:
      tags: [Finance]
      summary: Reconcile a transaction (async)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Reconciliation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/transactions/processPayment:
    post:
      tags: [Finance]
      summary: Process a payment transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                amount:
                  type: number
                  format: double
                currency:
                  type: string
                  nullable: true
                paymentMethodId:
                  type: string
                  nullable: true
              required: [businessId, amount]
      responses:
        '200':
          description: Payment processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/transactions/processRefund:
    post:
      tags: [Finance]
      summary: Process a refund transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionId:
                  type: string
                amount:
                  type: number
                  format: double
                  nullable: true
                reason:
                  type: string
                  nullable: true
              required: [transactionId]
      responses:
        '200':
          description: Refund processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/transactions/list:
    get:
      tags: [Finance]
      summary: List transactions (paginated)
      parameters:
        - in: query
          name: businessId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /api/transactions/export:
    post:
      tags: [Finance]
      summary: Export transactions to CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                startDate:
                  type: string
                  format: date-time
                  nullable: true
                endDate:
                  type: string
                  format: date-time
                  nullable: true
              required: [businessId]
      responses:
        '200':
          description: Export URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'


paths:
  # ── Payments ──────────────────────────────────────────────────────────────

  /api/payment/create:
    post:
      tags: [Finance]
      summary: Create a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId:
                  type: string
                  nullable: true
                businessId:
                  type: string
                amount:
                  type: number
                  format: double
                currency:
                  type: string
                  nullable: true
                method:
                  type: string
                  nullable: true
                customerId:
                  type: string
                  nullable: true
              required: [businessId, amount]
      responses:
        '200':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payment/retrieve:
    post:
      tags: [Finance]
      summary: Retrieve a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  nullable: true
                orderId:
                  type: string
                  nullable: true
                businessId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payment/update:
    post:
      tags: [Finance]
      summary: Update payment status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                status:
                  type: string
                  example: SUCCESS
              required: [id, status]
      responses:
        '200':
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payment/FIND:
    post:
      tags: [Finance]
      summary: Find payments by criteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                  nullable: true
                status:
                  type: string
                  nullable: true
                startDate:
                  type: string
                  format: date-time
                  nullable: true
                endDate:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Payment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payment/delete:
    post:
      tags: [Finance]
      summary: Delete a payment record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Payment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payment/webhook/razorpay:
    post:
      tags: [Finance]
      summary: Razorpay payment webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Payouts ───────────────────────────────────────────────────────────────

  /api/payout/account/create:
    post:
      tags: [Finance]
      summary: Create a payout account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                accountType:
                  type: string
                  example: BANK
                accountNumber:
                  type: string
                  nullable: true
                ifsc:
                  type: string
                  nullable: true
                upi:
                  type: string
                  nullable: true
              required: [businessId, accountType]
      responses:
        '200':
          description: Payout account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/account/retrieve:
    post:
      tags: [Finance]
      summary: Retrieve payout account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
              required: [businessId]
      responses:
        '200':
          description: Payout account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/account/update:
    post:
      tags: [Finance]
      summary: Update a payout account
      requestBody:
        required: true
        content:
          application/json:
            schema:

          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Payout account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/schedule/create:
    post:
      tags: [Finance]
      summary: Create a payout schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                frequency:
                  type: string
                  example: WEEKLY
                dayOfWeek:
                  type: integer
                  nullable: true
              required: [businessId, frequency]
      responses:
        '200':
          description: Payout schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/payout/schedule/retrieve:
    post:
      tags: [Finance]

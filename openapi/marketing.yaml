paths:
  # ── Marketing Campaigns (AI-driven) ──────────────────────────────────────

  /api/marketing/campaign/create:
    post:
      tags: [Marketing]
      summary: Create a marketing campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                name:
                  type: string
                  nullable: true
                goal:
                  type: string
                  nullable: true
                targetAudience:
                  type: string
                  nullable: true
              required: [businessId]
      responses:
        '200':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/campaign/{id}:
    get:
      tags: [Marketing]
      summary: Retrieve a marketing campaign
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/campaign/list:
    post:
      tags: [Marketing]
      summary: List marketing campaigns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                status:
                  type: string
                  nullable: true
              required: [businessId]
      responses:
        '200':
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/campaign/{id}/analytics:
    get:
      tags: [Marketing]
      summary: Get campaign analytics
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Campaign analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/insight/upload:
    post:
      tags: [Marketing]
      summary: Upload business insight for AI marketing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                content:
                  type: string
                  nullable: true
              required: [businessId]
      responses:
        '200':
          description: Insight uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/config/save:
    post:
      tags: [Marketing]
      summary: Save marketing (brand) config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                brandVoice:
                  type: string
                  nullable: true
                targetAudience:
                  type: string
                  nullable: true
              required: [businessId]
      responses:
        '200':
          description: Config saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/config/{businessId}:
    get:
      tags: [Marketing]
      summary: Get marketing brand config
      parameters:
        - in: path
          name: businessId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Brand config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/content/generate:
    post:
      tags: [Marketing]
      summary: Generate marketing content via AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignId:
                  type: string
                platform:
                  type: string
                  example: INSTAGRAM
              required: [campaignId, platform]
      responses:
        '200':
          description: Generated content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/content/list:
    post:
      tags: [Marketing]
      summary: List generated marketing content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
              required: [businessId]
      responses:
        '200':
          description: Content list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/content/{id}/approve:
    post:
      tags: [Marketing]
      summary: Approve generated marketing content
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Content approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/content/{id}/reject:
    post:
      tags: [Marketing]
      summary: Reject generated marketing content
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required: [reason]
      responses:
        '200':
          description: Content rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/content/{id}:
    put:
      tags: [Marketing]
      summary: Edit generated marketing content
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                primaryText:
                  type: string
                  nullable: true
                headline:
                  type: string
                  nullable: true
                callToAction:
                  type: string
                  nullable: true
                hashtags:
                  type: array
                  items:
                    type: string
                  nullable: true
      responses:
        '200':
          description: Content updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/content/{id}/schedule:
    post:
      tags: [Marketing]
      summary: Schedule marketing content for publishing
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publishAt:
                  type: string
                  format: date-time
                platform:
                  type: string
                  nullable: true
              required: [publishAt]
      responses:
        '200':
          description: Content scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/content/build-prompt:
    post:
      tags: [Marketing]
      summary: Build LLM prompt for local content generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignId:
                  type: string
                platform:
                  type: string
              required: [campaignId, platform]
      responses:
        '200':
          description: Prompt built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/content/finalize:
    post:
      tags: [Marketing]
      summary: Finalize locally generated marketing content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignId:
                  type: string
                generatedText:
                  type: string
                idempotencyKey:
                  type: string
              required: [campaignId, generatedText, idempotencyKey]
      responses:
        '200':
          description: Content finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/marketing/audit/{businessId}:
    get:
      tags: [Marketing]
      summary: Get marketing audit log
      parameters:
        - in: path
          name: businessId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            nullable: true
      responses:
        '200':
          description: Audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Campaigns (CRM-style) ─────────────────────────────────────────────────

  /api/campaign/create:
    post:
      tags: [Marketing]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                name:
                  type: string
                type:
                  type: string
                  example: EMAIL
                description:
                  type: string
                  nullable: true
              required: [businessId, name, type]
      responses:
        '200':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/campaign/update:
    post:
      tags: [Marketing]
      summary: Update a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                businessId:
                  type: string
                name:
                  type: string
                  nullable: true
                status:
                  type: string
                  nullable: true
              required: [id, businessId]
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/campaign/retrieve:
    post:
      tags: [Marketing]
      summary: Retrieve campaigns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  nullable: true
                businessId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/campaign/launch:
    post:
      tags: [Marketing]
      summary: Launch a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                businessId:
                  type: string
              required: [id, businessId]
      responses:
        '200':
          description: Campaign launched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/campaign/list:
    get:
      tags: [Marketing]
      summary: List campaigns (paginated)
      parameters:
        - in: query
          name: businessId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated campaign list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /api/campaign/create-segment:
    post:
      tags: [Marketing]
      summary: Create a campaign audience segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                name:
                  type: string
                criteriaType:
                  type: string
                criteriaOperator:
                  type: string
                criteriaValue:
                  type: string
              required: [businessId, name, criteriaType, criteriaOperator, criteriaValue]
      responses:
        '200':
          description: Segment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/campaign/retrieve-segments:
    post:
      tags: [Marketing]
      summary: Retrieve campaign segments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessId:
                  type: string
                  nullable: true
                campaignId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Segment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'


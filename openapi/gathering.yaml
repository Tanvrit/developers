paths:
  # ── Gatherings ────────────────────────────────────────────────────────────

  /api/gathering/CREATE:
    post:
      tags: [Gathering]
      summary: Create a gathering
      description: Creates a new gathering (event, wedding, etc.).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizerUserId:
                  type: string
                title:
                  type: string
                description:
                  type: string
                  nullable: true
                type:
                  type: string
                  nullable: true
                date:
                  type: string
                  format: date-time
                  nullable: true
                venue:
                  type: string
                  nullable: true
              required: [organizerUserId, title]
      responses:
        '200':
          description: Gathering created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/gathering/UPDATE:
    post:
      tags: [Gathering]
      summary: Update a gathering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                title:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                date:
                  type: string
                  format: date-time
                  nullable: true
                venue:
                  type: string
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Gathering updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/gathering/RETRIEVE:
    post:
      tags: [Gathering]
      summary: Retrieve gatherings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  nullable: true
                organizerUserId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Gathering list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/gathering/DELETE:
    post:
      tags: [Gathering]
      summary: Delete a gathering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Gathering deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/gathering/PUBLISH:
    post:
      tags: [Gathering]
      summary: Publish a gathering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Gathering published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/gathering/SUMMARY:
    post:
      tags: [Gathering]
      summary: Get gathering summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Gathering summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'


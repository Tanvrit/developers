paths:
  # ── Customer ──────────────────────────────────────────────────────────────

  /api/customer/CREATE_CUSTOMER:
    post:
      tags: [Customer]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  nullable: true
                businessId:
                  type: string
                name:
                  type: string
                mobile:
                  type: string
                  nullable: true
                dialCode:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
              required: [businessId, name]
      responses:
        '200':
          description: Customer created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Customer'

  /api/customer/UPDATE_CUSTOMER:
    post:
      tags: [Customer]
      summary: Update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                businessId:
                  type: string
                name:
                  type: string
                  nullable: true
                mobile:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
              required: [id]
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Customer'

  /api/customer/RETRIEVE_CUSTOMER:
    post:
      tags: [Customer]
      summary: Retrieve customers for a business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  nullable: true
                businessId:
                  type: string
              required: [businessId]
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      payload:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'

  /api/customer/FIND_CUSTOMER_BY_MOBILE:
    post:
      tags: [Customer]
      summary: Find customer by mobile
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                dialCode:
                  type: string
              required: [mobile, dialCode]
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Customer'

  /api/customer/DELETE_CUSTOMER:
    post:
      tags: [Customer]
      summary: Delete a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdRequest'
      responses:
        '200':
          description: Customer deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/customer/list:
    get:
      tags: [Customer]
      summary: List customers (paginated)
      parameters:
        - in: query
          name: businessId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated customer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  # ── Contacts ──────────────────────────────────────────────────────────────

  /api/contact/create:
    post:
      tags: [Customer]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
                  example: BUSINESS
                name:
                  type: string
                mobile:
                  type: string
                  nullable: true
                email:
                  type: string
                  nullable: true
              required: [ownerId, ownerType, name]
      responses:
        '200':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/contact/update:
    post:
      tags: [Customer]
      summary: Update a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactId:
                  type: string
                ownerId:
                  type: string
                name:
                  type: string
                  nullable: true
                mobile:
                  type: string
                  nullable: true
              required: [contactId]
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/contact/delete:
    post:
      tags: [Customer]
      summary: Delete a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactId:
                  type: string
              required: [contactId]
      responses:
        '200':
          description: Contact deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/contact/get:
    post:
      tags: [Customer]
      summary: Get contact details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactId:
                  type: string
              required: [contactId]
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/contact/list:
    post:
      tags: [Customer]
      summary: List contacts for an owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
              required: [ownerId, ownerType]
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/contact/find/duplicates:
    post:
      tags: [Customer]
      summary: Find duplicate contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId:
                  type: string
                ownerType:
                  type: string
              required: [ownerId, ownerType]
      responses:
        '200':
          description: Duplicate contact groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/contact/merge:
    post:
      tags: [Customer]
      summary: Merge two contacts
      description: Merges secondary contact into the primary contact record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactId:
                  type: string
                  description: Primary contact ID
                secondaryId:
                  type: string
              required: [contactId, secondaryId]
      responses:
        '200':
          description: Contacts merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/contact/statistics:
    get:
      tags: [Customer]
      summary: Get contact statistics
      parameters:
        - in: query
          name: ownerId
          required: true
          schema:
            type: string
        - in: query
          name: ownerType
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: Contact statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Phone Contacts ────────────────────────────────────────────────────────

  /contact/sync:
    post:
      tags: [Customer]
      summary: Sync phone contacts from device
      description: Uploads device contacts for matching against the platform user base.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      mobile:
                        type: string
                      dialCode:
                        type: string
              required: [contacts]
      responses:
        '200':
          description: Contacts synced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /contact/list:
    post:
      tags: [Customer]
      summary: Retrieve synced phone contacts
      description: Returns the user's previously synced device contacts.
      responses:
        '200':
          description: Phone contact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Favorites ─────────────────────────────────────────────────────────────

  /api/favorite/CREATE:
    post:
      tags: [Customer]
      summary: Add to favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                itemId:
                  type: string
                itemType:
                  type: string
                  example: PRODUCT
              required: [userId, itemId, itemType]
      responses:
        '200':
          description: Added to favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/favorite/RETRIEVE:
    post:
      tags: [Customer]
      summary: Retrieve favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                itemType:
                  type: string
                  nullable: true
              required: [userId]
      responses:
        '200':
          description: Favorites list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/favorite/DELETE:
    post:
      tags: [Customer]
      summary: Remove from favorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                itemId:
                  type: string
                itemType:
                  type: string
              required: [userId, itemId, itemType]
      responses:
        '200':
          description: Removed from favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  # ── Wishlists ─────────────────────────────────────────────────────────────

  /api/wishlist/CREATE:
    post:
      tags: [Customer]
      summary: Create a wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                  nullable: true
              required: [userId, name]
      responses:
        '200':
          description: Wishlist created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wishlist/RETRIEVE:
    post:
      tags: [Customer]
      summary: Retrieve wishlists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
              required: [userId]
      responses:
        '200':
          description: Wishlist list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wishlist/UPDATE:
    post:
      tags: [Customer]
      summary: Update a wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                userId:
                  type: string
                name:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
              required: [id, userId]
      responses:
        '200':
          description: Wishlist updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wishlist/DELETE:
    post:
      tags: [Customer]
      summary: Delete a wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                userId:
                  type: string
              required: [id, userId]
      responses:
        '200':
          description: Wishlist deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wishlist/ADD_ITEM:
    post:
      tags: [Customer]
      summary: Add item to wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wishlistId:
                  type: string
                itemId:
                  type: string
                itemType:
                  type: string
              required: [wishlistId, itemId, itemType]
      responses:
        '200':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/wishlist/REMOVE_ITEM:
    post:
      tags: [Customer]
      summary: Remove item from wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wishlistId:
                  type: string
                itemId:
                  type: string
              required: [wishlistId, itemId]
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mobile:
          type: string
          nullable: true
        dialCode:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        businessId:
          type: string
        totalOrders:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # npx wrangler only; nothing here needs macOS (no Xcode, no Safari). Linux X64
    # (Parmar) since 2026-09-23, reverting the 2026-09-07 disk-outage detour to macOS
    # (whose `labels: [macOS]` also lacked `self-hosted`). Keep X64 explicit: a bare
    # [self-hosted, Linux] also matches the ARM64 GX10 pool, and an OS label is required
    # either way because the group also holds a Windows node, where bash steps parse as pwsh.
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 15
    # Auth is the CLOUDFLARE_API_TOKEN repo secret passed to wrangler below, not
    # runner-local wrangler state (the 2026-09-11 macOS run logged
    # `CLOUDFLARE_API_TOKEN: ***`), so the deploy does not depend on which runner picks it up.
    # R24: This deploys developers.tanvrit.com to production. Require approval.
    environment: production
    name: Deploy

    steps:
      - uses: actions/checkout@v4

      # The macOS runners had a Homebrew node on PATH (and npx resolved a local wrangler
      # 4.73.0 there); the Linux runners guarantee neither. No Actions cache: nothing is
      # installed from a lockfile here, and on self-hosted runners the cache round-trip
      # costs more than it saves.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # wrangler@4 pins the major so a future wrangler 5 cannot change this deploy
      # underneath it; --yes skips npx's install prompt on a runner with no wrangler.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy . --project-name tanvrit-developers --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ce3f0ef57641c98d52af95c069bbb6a2

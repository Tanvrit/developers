name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      group: tanvrit
      # Linux self-hosted runner fleet back online 2026-07-11 — reverted from macOS fallback
      labels: [Linux]
    # Self-hosted runner required: wrangler pre-authenticated via runner-local
    # CF credentials; migrating to ubuntu-latest requires a CLOUDFLARE_API_TOKEN
    # org secret (see R23 migration doc). Keep self-hosted until token is
    # provisioned in org secrets.
    # R24: This deploys developers.tanvrit.com to production. Require approval.
    environment: production
    name: Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name tanvrit-developers --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ce3f0ef57641c98d52af95c069bbb6a2

openapi: 3.1.0
info:
  title: Tanvrit Server API
  description: 'REST API for the Tanvrit commerce platform. Covers authentication, business management,

    inventory, orders, CRM, compute, gathering/events, workforce, marketing, notifications,

    support, finance, media, social, and platform administration.


    **Authentication**: Most endpoints require a JWT Bearer token obtained via

    `/api/auth/AUTHENTICATE` or `/api/auth/LOGIN_EMAIL`. Pass it as `Authorization: Bearer <token>`.


    **Request pattern**: The API uses a POST-based RPC style. All mutations and queries are POST

    requests with JSON bodies. Responses follow a uniform envelope: `{ status, message, payload }`.


    **AI Commerce Gateway**: Merchant endpoints use `X-API-Key` (obtain via `/api/ai/v1/keys/create`).

    Public catalog endpoints require no auth.

    '
  version: 1.0.0
  contact:
    name: Tanvrit Engineering
    url: https://tanvrit.com
servers:
- url: https://api.tanvrit.com
  description: Production
- url: http://localhost:8080
  description: Local development
tags:
- name: Auth
  description: User authentication, OTP, registration, and session management
- name: Business
  description: Business (store) CRUD, codes, config, types, connections, and hierarchy
- name: AI Commerce
  description: AI Commerce Gateway — merchant, customer, and catalog endpoints for AI agents
- name: Inventory Products
  description: Products, categories, subcategories, brands, colors, sizes, UOM, barcodes, and models
- name: Inventory Pricing
  description: Offers, discounts, coupons, product prices, bundles, and gift cards
- name: Inventory Stock
  description: Stock levels, batches, audits, health, velocity, restock alerts, suppliers, purchase orders, warehouse, and
    transfers
- name: Orders
  description: Order lifecycle, cart, fulfillment, returns, and pre-orders
- name: Customer
  description: Customer records, contacts, phone contacts, favorites, and wishlists
- name: Pricing
  description: Price tiers, schedules, customer groups, and price calculation
- name: CRM
  description: Leads, deals, pipelines, companies, activities, tasks, email sequences, workflows, and web forms
- name: Compute
  description: Distributed compute jobs, nodes, templates, schedules, volumes, artifacts, billing, and marketplace
- name: Gathering
  description: Gatherings (weddings/events), attendees, groups, RSVPs, check-ins, budgets, seating, vendors, and invitations
- name: Education
  description: Schools, classes, exams, and grades
- name: Workforce
  description: Employees, job roles, jobs, attendance, shifts, and commissions
- name: Marketing
  description: Marketing campaigns, email marketing, LLM content, image generation, and promotions
- name: Notifications
  description: Push notifications, in-app notifications, templates, preferences, and live updates
- name: Support
  description: Support tickets, articles, canned responses, and public help center
- name: Finance
  description: Payments, payouts, wallets, transactions, invoices, accounting, tax, sales, and currency
- name: Media & Social
  description: Media files, presigned uploads, feed, posts, follows, ratings, reviews, referrals, loyalty, and subscriptions
- name: Platform & Admin
  description: Platform config, admin tools, control plane, monitoring, app builds, themes, store hours, webhooks, and infrastructure
security:
- BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from /api/auth/AUTHENTICATE or /api/auth/LOGIN_EMAIL
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for AI Commerce Gateway merchant endpoints. Obtain via /api/ai/v1/keys/create
  schemas:
    BaseResponse:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        message:
          type: string
          example: Success
          nullable: true
      required:
      - status
    PaginatedResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
          nullable: true
        payload:
          type: array
          items: {}
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    IdRequest:
      type: object
      properties:
        id:
          type: string
      required:
      - id
    AuthMobileRequest:
      type: object
      properties:
        mobile:
          type: string
          example: '9876543210'
        dialCode:
          type: string
          example: '+91'
        name:
          type: string
          nullable: true
          example: John Doe
      required:
      - mobile
      - dialCode
    LoginEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 6
      required:
      - email
      - password
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    AuthTokenResponse:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        message:
          type: string
          nullable: true
        payload:
          type: object
          nullable: true
          properties:
            token:
              type: string
              description: JWT access token
            refreshToken:
              type: string
              description: Refresh token for obtaining new access tokens
            user:
              $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mobile:
          type: string
          nullable: true
        dialCode:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        profileImage:
          type: string
          nullable: true
        isVerified:
          type: boolean
          nullable: true
        role:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    SendOtpRequest:
      type: object
      properties:
        mobile:
          type: string
          example: '9876543210'
        dialCode:
          type: string
          example: '+91'
        appId:
          type: string
          nullable: true
          description: Overridden by X-App-ID header
      required:
      - mobile
      - dialCode
    VerifyOtpRequest:
      type: object
      properties:
        otpId:
          type: string
          description: ID returned by SEND_OTP
        otp:
          type: string
          description: The OTP code received by the user
          maxLength: 8
      required:
      - otpId
      - otp
    Business:
      type: object
      properties:
        id:
          type: string
        business_name:
          type: string
        mobile:
          type: string
        dialCode:
          type: string
        email:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        businessType:
          type: string
          nullable: true
        profileImage:
          type: string
          nullable: true
        userId:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - PENDING
          - SUSPENDED
          - REJECTED
        created_at:
          type: string
          format: date-time
          nullable: true
    CreateBusinessRequest:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        mobile:
          type: string
        dialCode:
          type: string
        email:
          type: string
          nullable: true
        businessType:
          type: string
          nullable: true
      required:
      - userId
      - name
      - mobile
      - dialCode
    BusinessConfig:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        currency:
          type: string
          example: INR
        timezone:
          type: string
          example: Asia/Kolkata
        deliveryEnabled:
          type: boolean
        taxEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
    CreateBusinessConfigRequest:
      type: object
      properties:
        businessId:
          type: string
        currency:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        deliveryEnabled:
          type: boolean
          nullable: true
        taxEnabled:
          type: boolean
          nullable: true
      required:
      - businessId
    BusinessStore:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        storeName:
          type: string
        storeCode:
          type: string
          nullable: true
        storeType:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
    PaymentGatewayConfigRequest:
      type: object
      properties:
        storeId:
          type: string
        gatewayType:
          type: string
          example: RAZORPAY
        credentials:
          type: object
          description: Gateway-specific credentials (key/secret pairs)
      required:
      - storeId
      - gatewayType
    AiProduct:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int64
        price:
          type: number
          format: double
        currencySymbol:
          type: string
          example: ₹
        images:
          type: array
          items:
            type: string
        categoryId:
          type: string
          nullable: true
        isActive:
          type: boolean
    AiProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/AiProduct'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
    AiAnalyticsSummary:
      type: object
      properties:
        totalRevenue:
          type: number
          format: double
        totalOrders:
          type: integer
        totalCustomers:
          type: integer
        pendingOrders:
          type: integer
        averageOrderValue:
          type: number
          format: double
        totalProducts:
          type: integer
        topProducts:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              name:
                type: string
              totalSold:
                type: integer
        revenueByDate:
          type: object
          additionalProperties:
            type: number
        ordersByStatus:
          type: object
          additionalProperties:
            type: integer
    AiCustomerSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mobile:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        totalOrders:
          type: integer
        createdAt:
          type: string
          format: date-time
          nullable: true
    AiCustomerListResponse:
      type: object
      properties:
        customers:
          type: array
          items:
            $ref: '#/components/schemas/AiCustomerSummary'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
    AiOrderSummary:
      type: object
      properties:
        orderId:
          type: string
        orderNumber:
          type: string
        status:
          type: string
        totalAmount:
          type: number
          format: double
    AiOrderDetail:
      allOf:
      - $ref: '#/components/schemas/AiOrderSummary'
      - type: object
        properties:
          customerName:
            type: string
            nullable: true
          customerMobile:
            type: string
            nullable: true
          items:
            type: array
            items:
              type: object
              properties:
                productId:
                  type: string
                name:
                  type: string
                quantity:
                  type: integer
                unitPrice:
                  type: number
                  format: double
                lineTotal:
                  type: number
                  format: double
          createdAt:
            type: string
            format: date-time
            nullable: true
    AiOrderListResponse:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/AiOrderSummary'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean
    AiDeclineOrderRequest:
      type: object
      properties:
        reason:
          type: string
          example: OUT_OF_STOCK
        reasonDescription:
          type: string
          nullable: true
      required:
      - reason
    CreateAiApiKeyRequest:
      type: object
      properties:
        businessId:
          type: string
        label:
          type: string
          example: My ChatGPT Plugin Key
        scopes:
          type: array
          items:
            type: string
            enum:
            - READ_ORDERS
            - WRITE_ORDERS
            - READ_PRODUCTS
            - WRITE_PRODUCTS
            - READ_ANALYTICS
            - READ_CUSTOMERS
        expiresInDays:
          type: integer
          nullable: true
          description: Omit for no expiry
      required:
      - businessId
      - label
      - scopes
    AiApiKeyCreatedResponse:
      type: object
      properties:
        keyId:
          type: string
        apiKey:
          type: string
          description: Raw key — shown only once at creation
        keyPrefix:
          type: string
          example: fai_
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
        businessId:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
    AiApiKeyResponse:
      type: object
      properties:
        id:
          type: string
        keyPrefix:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isRevoked:
          type: boolean
    AiApiKeyListResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/AiApiKeyResponse'
    AiCartItem:
      type: object
      properties:
        cartItemId:
          type: string
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        lineTotal:
          type: number
          format: double
        currencySymbol:
          type: string
    AiCartSummary:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiCartItem'
        itemCount:
          type: integer
        total:
          type: number
          format: double
        businessId:
          type: string
        storeId:
          type: string
          nullable: true
    AiAddToCartRequest:
      type: object
      properties:
        productId:
          type: string
        businessId:
          type: string
        quantity:
          type: integer
          minimum: 1
        storeId:
          type: string
          nullable: true
        priceId:
          type: string
          nullable: true
      required:
      - productId
      - businessId
      - quantity
    AiCheckoutRequest:
      type: object
      properties:
        businessId:
          type: string
        storeId:
          type: string
          nullable: true
      required:
      - businessId
    AiCheckoutResult:
      type: object
      properties:
        orderId:
          type: string
        orderNumber:
          type: string
        status:
          type: string
        totalAmount:
          type: number
          format: double
        message:
          type: string
          nullable: true
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: double
          nullable: true
        images:
          type: array
          items:
            type: string
        categoryId:
          type: string
          nullable: true
        subCategoryId:
          type: string
          nullable: true
        businessId:
          type: string
        storeId:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int64
          nullable: true
        brandId:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
    CreateProductRequest:
      type: object
      properties:
        userId:
          type: string
        businessId:
          type: string
        storeId:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        subCategoryId:
          type: string
          nullable: true
        quantity:
          type: integer
          format: int64
          nullable: true
      required:
      - userId
      - businessId
      - name
    ProductCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
          nullable: true
        businessId:
          type: string
        parentId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    Order:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        businessId:
          type: string
        storeId:
          type: string
          nullable: true
        items:
          type: array
          items:
            type: object
        totalAmount:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - PREPARING
          - READY
          - DISPATCHED
          - DELIVERED
          - CANCELLED
          - DECLINED
        createdAt:
          type: string
          format: date-time
          nullable: true
    CartItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        name:
          type: string
          nullable: true
        quantity:
          type: integer
        price:
          type: number
          format: double
        image:
          type: string
          nullable: true
    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        mobile:
          type: string
          nullable: true
        dialCode:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        businessId:
          type: string
        totalOrders:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
    PriceTier:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        minQuantity:
          type: integer
        maxQuantity:
          type: integer
          nullable: true
        unitPrice:
          type: number
          format: double
          nullable: true
        discountPercent:
          type: number
          format: double
          nullable: true
paths:
  /api/auth/CHECK_ACCOUNT:
    post:
      tags:
      - Auth
      summary: Check if an account exists
      description: Checks whether a user account exists for the given mobile number. Rate-limited to 5 attempts per 15 minutes
        per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthMobileRequest'
      responses:
        '200':
          description: Account check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '429':
          description: Too many requests
  /api/auth/AUTHENTICATE:
    post:
      tags:
      - Auth
      summary: Authenticate user (OTP-based)
      description: Authenticates via mobile + OTP. Returns JWT access token and refresh token on success. Rate-limited to
        5 attempts per 15 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthMobileRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Authentication failed
  /api/auth/REGISTER:
    post:
      tags:
      - Auth
      summary: Register new user
      description: Creates a new user account with mobile number. Rate-limited to 5 attempts per 15 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AuthMobileRequest'
              - type: object
                properties:
                  name:
                    type: string
                    example: John Doe
                required:
                - name
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
  /api/auth/VERIFY_PASSWORD:
    post:
      tags:
      - Auth
      summary: Verify password (MPIN / password login)
      description: Authenticates using mobile + password/MPIN. May return a 2FA challenge if configured.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  example: '9876543210'
                dialCode:
                  type: string
                  example: '+91'
                password:
                  type: string
                  format: password
              required:
              - mobile
              - dialCode
              - password
      responses:
        '200':
          description: Authenticated or 2FA challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid credentials
  /api/auth/LOGIN_EMAIL:
    post:
      tags:
      - Auth
      summary: Login with email and password
      description: Authenticates using email + password. Rate-limited to 5 attempts per 15 minutes per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEmailRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid credentials
  /api/auth/REFRESH_TOKEN:
    post:
      tags:
      - Auth
      summary: Refresh access token
      description: Exchanges a valid refresh token for a new JWT access token. Rate-limited to 10 attempts per 15 minutes
        per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid or expired refresh token
  /api/auth/LOGOUT:
    post:
      tags:
      - Auth
      summary: Logout current user
      description: Invalidates the current session for the authenticated user.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/auth/RETRIEVE_ALL_LANGUAGE:
    post:
      tags:
      - Auth
      summary: List supported languages
      description: Returns all supported UI languages for the platform.
      security: []
      responses:
        '200':
          description: Language list
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    payload:
                      type: array
                      items:
                        type: string
                        example: en
  /api/auth/GET_USER:
    post:
      tags:
      - Auth
      summary: Get authenticated user details
      description: Returns the profile of the currently authenticated user.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    payload:
                      $ref: '#/components/schemas/User'
  /api/auth/SET_PASSWORD:
    post:
      tags:
      - Auth
      summary: Set or change password
      description: Sets or updates the user's password/MPIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  minLength: 4
              required:
              - password
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
  /api/auth/UPDATE_FCM_TOKEN:
    post:
      tags:
      - Auth
      summary: Update FCM push token
      description: Registers or updates the Firebase Cloud Messaging device token for push notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fcmToken:
                  type: string
                  description: FCM device token
                deviceId:

  /api/otp/SEND_OTP:
    post:
      tags:
      - Auth
      summary: Send OTP
      description: 'Sends a one-time password to the given mobile number. Rate-limited per IP (5/15 min),

        per mobile (3/10 min), and per phone-IP pair. Requires `X-App-ID` header.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpRequest'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    payload:
                      type: object
                      properties:
                        otpId:
                          type: string
                          description: Opaque ID used when calling VERIFY_OTP
        '429':
          description: Rate limit exceeded
  /api/otp/VERIFY_OTP:
    post:
      tags:
      - Auth
      summary: Verify OTP
      description: Verifies the OTP code against the otpId. On success, resets the IP rate-limit bucket. Requires `X-App-ID`
        header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/BaseResponse'
                - type: object
                  properties:
                    payload:
                      type: object
                      properties:
                        verified:
                          type: boolean
        '400':
          description: Invalid or expired OTP
        '429':
          description: Rate limit exceeded
